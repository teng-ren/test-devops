apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployments.yaml
  - services.yaml
  - serviceaccounts.yaml
  - hpa.yaml
  - postgres-base.yaml

configMapGenerator:
  - name: auth-postgres-init-scripts
    files:
      - db/01-schema.sql
      - db/seed.sh
    options:
      disableNameSuffixHash: true
