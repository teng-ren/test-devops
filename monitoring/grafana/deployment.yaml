apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: dev
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false
        jsonData:
          timeInterval: 15s
          httpMethod: POST
      - name: Google Cloud Monitoring
        type: stackdriver
        access: proxy
        isDefault: false
        editable: false
        jsonData:
          authenticationType: gce
          defaultProject: dop-assignment-team1
      - name: Google Cloud Logging
        type: stackdriver
        access: proxy
        isDefault: false
        editable: false
        jsonData:
          authenticationType: gce
          defaultProject: dop-assignment-team1
          logType: cloud_logging
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: dev
data:
  k8s-monitoring.json: |
    {
      "title": "AI Model Tester - Governance Dashboard",
        "description": "Real-time observability and security logging for the governance system",
        "tags": ["governance", "observability", "security"],
        "timezone": "browser",
        "refresh": "10s",
        "time": {
          "from": "now-6h",
          "to": "now"
        },
        "panels": [
          {
            "id": 1,
            "title": "GOVERNANCE METRICS",
            "type": "row",
            "gridPos": { "x": 0, "y": 0, "w": 24, "h": 1 },
            "collapsed": false
          },
          {
            "id": 2,
            "title": "Requests Per Second (RPS)",
            "type": "stat",
            "datasource": "Prometheus",
            "gridPos": { "x": 0, "y": 1, "w": 4, "h": 4 },
            "targets": [
              {
                "expr": "sum(rate(http_requests_total[5m])) or sum(rate(gcp_http_request_count[5m])) or on() vector(0)",
                "refId": "A"
              }
            ],
            "options": {
              "colorMode": "value",
              "graphMode": "area",
              "orientation": "auto",
              "textMode": "value_and_name"
            },
            "fieldConfig": {
              "defaults": {
                "unit": "reqps",
                "decimals": 2,
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    { "value": null, "color": "green" },
                    { "value": 100, "color": "yellow" },
                    { "value": 500, "color": "red" }
                  ]
                }
              }
            }
          },
          {
            "id": 3,
            "title": "Error Rate (%)",
            "type": "stat",
            "datasource": "Prometheus",
            "gridPos": { "x": 4, "y": 1, "w": 4, "h": 4 },
            "targets": [
              {
                "expr": "(sum(rate(http_requests_total{status=~\"5..\"}[5m])) / clamp_min(sum(rate(http_requests_total[5m])), 1)) * 100",
                "refId": "A"
              }
            ],
            "options": {
              "colorMode": "value",
              "graphMode": "area",
              "orientation": "auto",
              "textMode": "value_and_name"
            },
            "fieldConfig": {
              "defaults": {
                "unit": "percent",
                "decimals": 2,
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    { "value": null, "color": "green" },
                    { "value": 1, "color": "yellow" },
                    { "value": 5, "color": "red" }
                  ]
                }
              }
            }
          },
          {
            "id": 4,
            "title": "Prompts Blocked (Security)",
            "type": "stat",
            "datasource": "Prometheus",
            "gridPos": { "x": 8, "y": 1, "w": 4, "h": 4 },
            "targets": [
              {
                "expr": "sum(increase(prompts_blocked_total[5m])) or on() vector(0)",
                "refId": "A"
              }
            ],
            "options": {
              "colorMode": "value",
              "graphMode": "none",
              "orientation": "auto",
              "textMode": "value_and_name"
            },
            "fieldConfig": {
              "defaults": {
                "unit": "short",
                "decimals": 0,
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    { "value": null, "color": "green" },
                    { "value": 1, "color": "yellow" },
                    { "value": 10, "color": "red" }
                  ]
                }
              }
            }
          },
          {
            "id": 5,
            "title": "Messages in Queue",
            "type": "stat",
            "datasource": "Prometheus",
            "gridPos": { "x": 12, "y": 1, "w": 4, "h": 4 },
            "targets": [
              {
                "expr": "messages_in_queue or on() vector(0)",
                "refId": "A"
              }
            ],
            "options": {
              "colorMode": "value",
              "graphMode": "area",
              "orientation": "auto",
              "textMode": "value_and_name"
            },
            "fieldConfig": {
              "defaults": {
                "unit": "short",
                "decimals": 0,
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    { "value": null, "color": "green" },
                    { "value": 100, "color": "yellow" },
                    { "value": 1000, "color": "red" }
                  ]
                }
              }
            }
          },
          {
            "id": 6,
            "title": "Active Nodes",
            "type": "stat",
            "datasource": "Prometheus",
            "gridPos": { "x": 16, "y": 1, "w": 4, "h": 4 },
            "targets": [
              {
                "expr": "count(count by (cluster_name) (gke_node_cpu_utilization)) or on() vector(0)",
                "refId": "A"
              }
            ],
            "options": {
              "colorMode": "value",
              "graphMode": "none",
              "orientation": "auto",
              "textMode": "value_and_name"
            },
            "fieldConfig": {
              "defaults": {
                "unit": "short",
                "decimals": 0
              }
            }
          },
          {
            "id": 7,
            "title": "Pod Count",
            "type": "stat",
            "datasource": "Prometheus",
            "gridPos": { "x": 20, "y": 1, "w": 4, "h": 4 },
            "targets": [
              {
                "expr": "count(gke_pod_network_sent_bytes_total) or on() vector(0)",
                "refId": "A"
              }
            ],
            "options": {
              "colorMode": "value",
              "graphMode": "none",
              "orientation": "auto",
              "textMode": "value_and_name"
            },
            "fieldConfig": {
              "defaults": {
                "unit": "short",
                "decimals": 0
              }
            }
          },
          {
            "id": 8,
            "title": "RESOURCE UTILIZATION",
            "type": "row",
            "gridPos": { "x": 0, "y": 5, "w": 24, "h": 1 },
            "collapsed": false
          },
          {
            "id": 9,
            "title": "CPU Load (%)",
            "type": "stat",
            "datasource": "Prometheus",
            "gridPos": { "x": 0, "y": 6, "w": 6, "h": 6 },
            "targets": [
              {
                "expr": "avg(gke_node_cpu_utilization) or on() vector(0)",
                "refId": "A"
              }
            ],
            "options": {
              "colorMode": "value",
              "graphMode": "area",
              "orientation": "auto",
              "textMode": "value_and_name"
            },
            "fieldConfig": {
              "defaults": {
                "unit": "percent",
                "decimals": 1,
                "max": 100,
                "min": 0,
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    { "value": null, "color": "green" },
                    { "value": 70, "color": "yellow" },
                    { "value": 90, "color": "red" }
                  ]
                }
              }
            }
          },
          {
            "id": 10,
            "title": "Memory Usage (%)",
            "type": "stat",
            "datasource": "Prometheus",
            "gridPos": { "x": 6, "y": 6, "w": 6, "h": 6 },
            "targets": [
              {
                "expr": "avg(gke_node_memory_utilization) or on() vector(0)",
                "refId": "A"
              }
            ],
            "options": {
              "colorMode": "value",
              "graphMode": "area",
              "orientation": "auto",
              "textMode": "value_and_name"
            },
            "fieldConfig": {
              "defaults": {
                "unit": "percent",
                "decimals": 1,
                "max": 100,
                "min": 0,
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    { "value": null, "color": "green" },
                    { "value": 75, "color": "yellow" },
                    { "value": 90, "color": "red" }
                  ]
                }
              }
            }
          },
          {
            "id": 11,
            "title": "Network I/O (Mbps)",
            "type": "stat",
            "datasource": "Prometheus",
            "gridPos": { "x": 16, "y": 6, "w": 8, "h": 4 },
            "targets": [
              {
                "expr": "(sum(rate(gke_pod_network_sent_bytes_total[5m])) * 8 / 1000000) or ((sum(rate(node_network_transmit_bytes_total{device!~\"lo\"}[5m])) + sum(rate(node_network_receive_bytes_total{device!~\"lo\"}[5m]))) * 8 / 1000000) or on() vector(0)",
                "refId": "A"
              }
            ],
            "options": {
              "colorMode": "value",
              "graphMode": "area",
              "orientation": "auto",
              "textMode": "value_and_name"
            },
            "fieldConfig": {
              "defaults": {
                "unit": "Mbps",
                "decimals": 1
              }
            }
          },
          {
            "id": 12,
            "title": "SECURITY & LOGGING",
            "type": "row",
            "gridPos": { "x": 0, "y": 10, "w": 24, "h": 1 },
            "collapsed": false
          },
          {
            "id": 13,
            "title": "Auth Failures (5m)",
            "type": "stat",
            "datasource": "Prometheus",
            "gridPos": { "x": 0, "y": 11, "w": 6, "h": 4 },
            "targets": [
              {
                "expr": "sum(increase(auth_failures_total[5m])) or on() vector(0)",
                "refId": "A"
              }
            ],
            "options": {
              "colorMode": "value",
              "graphMode": "none",
              "orientation": "auto",
              "textMode": "value_and_name"
            },
            "fieldConfig": {
              "defaults": {
                "unit": "short",
                "decimals": 0,
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    { "value": null, "color": "green" },
                    { "value": 5, "color": "yellow" },
                    { "value": 20, "color": "red" }
                  ]
                }
              }
            }
          },
          {
            "id": 14,
            "title": "Security Events (5m)",
            "type": "stat",
            "datasource": "Prometheus",
            "gridPos": { "x": 6, "y": 11, "w": 6, "h": 4 },
            "targets": [
              {
                "expr": "sum(increase(security_events_total[5m])) or on() vector(0)",
                "refId": "A"
              }
            ],
            "options": {
              "colorMode": "value",
              "graphMode": "none",
              "orientation": "auto",
              "textMode": "value_and_name"
            },
            "fieldConfig": {
              "defaults": {
                "unit": "short",
                "decimals": 0
              }
            }
          },
          {
            "id": 15,
            "title": "Messages Sent (RPS)",
            "type": "stat",
            "datasource": "Prometheus",
            "gridPos": { "x": 12, "y": 11, "w": 6, "h": 4 },
            "targets": [
              {
                "expr": "sum(rate(messages_sent_total[5m])) or on() vector(0)",
                "refId": "A"
              }
            ],
            "options": {
              "colorMode": "value",
              "graphMode": "area",
              "orientation": "auto",
              "textMode": "value_and_name"
            },
            "fieldConfig": {
              "defaults": {
                "unit": "reqps",
                "decimals": 2
              }
            }
          },
          {
            "id": 16,
            "title": "Uptime (%)",
            "type": "stat",
            "datasource": "Prometheus",
            "gridPos": { "x": 18, "y": 11, "w": 6, "h": 4 },
            "targets": [
              {
                "expr": "(1 - (sum(increase(http_requests_total{status=~\"5..\"}[24h])) / clamp_min(sum(increase(http_requests_total[24h])), 1))) * 100",
                "refId": "A"
              }
            ],
            "options": {
              "colorMode": "value",
              "graphMode": "area",
              "orientation": "auto",
              "textMode": "value_and_name"
            },
            "fieldConfig": {
              "defaults": {
                "unit": "percent",
                "decimals": 2,
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    { "value": 99, "color": "red" },
                    { "value": 99.5, "color": "yellow" },
                    { "value": 99.9, "color": "green" }
                  ]
                }
              }
            }
          },
          {
            "id": 17,
            "title": "Request Timeline (6h)",
            "type": "timeseries",
            "datasource": "Prometheus",
            "gridPos": { "x": 0, "y": 15, "w": 12, "h": 8 },
            "targets": [
              {
                "expr": "sum(rate(http_requests_total[5m])) or on() vector(0)",
                "legendFormat": "RPS",
                "refId": "A"
              }
            ],
            "options": {
              "legend": {
                "calcs": ["mean", "max"],
                "displayMode": "table"
              }
            },
            "fieldConfig": {
              "defaults": {
                "unit": "reqps",
                "decimals": 2
              }
            }
          },
          {
            "id": 18,
            "title": "Error Rate Timeline (6h)",
            "type": "timeseries",
            "datasource": "Prometheus",
            "gridPos": { "x": 12, "y": 15, "w": 12, "h": 8 },
            "targets": [
              {
                "expr": "(sum(rate(http_requests_total{status=~\"5..\"}[5m])) / clamp_min(sum(rate(http_requests_total[5m])), 1)) * 100",
                "legendFormat": "Error Rate",
                "refId": "A"
              }
            ],
            "options": {
              "legend": {
                "calcs": ["mean", "max"],
                "displayMode": "table"
              }
            },
            "fieldConfig": {
              "defaults": {
                "unit": "percent",
                "decimals": 2
              }
            }
          },
          {
            "id": 19,
            "title": "GCP INFRASTRUCTURE METRICS",
            "type": "row",
            "gridPos": { "x": 0, "y": 23, "w": 24, "h": 1 },
            "collapsed": false
          },
          {
            "id": 20,
            "title": "GKE Node CPU Utilization by Node",
            "type": "timeseries",
            "datasource": "Prometheus",
            "gridPos": { "x": 0, "y": 24, "w": 12, "h": 8 },
            "targets": [
              {
                "expr": "gke_node_cpu_utilization",
                "legendFormat": "{{node_name}}",
                "refId": "A"
              }
            ],
            "options": {
              "legend": {
                "calcs": ["mean", "max", "last"],
                "displayMode": "table",
                "placement": "bottom"
              }
            },
            "fieldConfig": {
              "defaults": {
                "unit": "percent",
                "decimals": 1,
                "min": 0,
                "max": 100
              }
            }
          },
          {
            "id": 21,
            "title": "GKE Node Memory Utilization by Node",
            "type": "timeseries",
            "datasource": "Prometheus",
            "gridPos": { "x": 12, "y": 24, "w": 12, "h": 8 },
            "targets": [
              {
                "expr": "gke_node_memory_utilization",
                "legendFormat": "{{node_name}}",
                "refId": "A"
              }
            ],
            "options": {
              "legend": {
                "calcs": ["mean", "max", "last"],
                "displayMode": "table",
                "placement": "bottom"
              }
            },
            "fieldConfig": {
              "defaults": {
                "unit": "percent",
                "decimals": 1,
                "min": 0,
                "max": 100
              }
            }
          },
          {
            "id": 22,
            "title": "GKE Container CPU Usage (Top 10)",
            "type": "timeseries",
            "datasource": "Prometheus",
            "gridPos": { "x": 0, "y": 32, "w": 12, "h": 8 },
            "targets": [
              {
                "expr": "topk(10, rate(gke_container_cpu_usage_seconds[5m]))",
                "legendFormat": "{{pod_name}} - {{container_name}}",
                "refId": "A"
              }
            ],
            "options": {
              "legend": {
                "calcs": ["mean", "max", "last"],
                "displayMode": "table",
                "placement": "bottom"
              }
            },
            "fieldConfig": {
              "defaults": {
                "unit": "short",
                "decimals": 3
              }
            }
          },
          {
            "id": 23,
            "title": "GKE Container Memory Usage (Top 10)",
            "type": "timeseries",
            "datasource": "Prometheus",
            "gridPos": { "x": 12, "y": 32, "w": 12, "h": 8 },
            "targets": [
              {
                "expr": "topk(10, gke_container_memory_usage_bytes)",
                "legendFormat": "{{pod_name}} - {{container_name}}",
                "refId": "A"
              }
            ],
            "options": {
              "legend": {
                "calcs": ["mean", "max", "last"],
                "displayMode": "table",
                "placement": "bottom"
              }
            },
            "fieldConfig": {
              "defaults": {
                "unit": "bytes",
                "decimals": 2
              }
            }
          },
          {
            "id": 24,
            "title": "GKE Pod Network Sent (Top 10)",
            "type": "timeseries",
            "datasource": "Prometheus",
            "gridPos": { "x": 0, "y": 40, "w": 12, "h": 8 },
            "targets": [
              {
                "expr": "topk(10, rate(gke_pod_network_sent_bytes_total[5m]))",
                "legendFormat": "{{pod_name}}",
                "refId": "A"
              }
            ],
            "options": {
              "legend": {
                "calcs": ["mean", "max", "last"],
                "displayMode": "table",
                "placement": "bottom"
              }
            },
            "fieldConfig": {
              "defaults": {
                "unit": "Bps",
                "decimals": 2
              }
            }
          },
          {
            "id": 25,
            "title": "GKE Pod Network Received (Top 10)",
            "type": "timeseries",
            "datasource": "Prometheus",
            "gridPos": { "x": 12, "y": 40, "w": 12, "h": 8 },
            "targets": [
              {
                "expr": "topk(10, rate(gke_pod_network_received_bytes_total[5m]))",
                "legendFormat": "{{pod_name}}",
                "refId": "A"
              }
            ],
            "options": {
              "legend": {
                "calcs": ["mean", "max", "last"],
                "displayMode": "table",
                "placement": "bottom"
              }
            },
            "fieldConfig": {
              "defaults": {
                "unit": "Bps",
                "decimals": 2
              }
            }
          }
        ],
        "schemaVersion": 38,
        "style": "dark",
        "templating": {
          "list": []
        },
        "uid": "governance-dashboard"
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-config
  namespace: dev
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'default'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        updateIntervalSeconds: 10
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-storage
  namespace: dev
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: dev
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      securityContext:
        fsGroup: 472
        runAsUser: 472
      serviceAccountName: grafana
      containers:
        - name: grafana
          image: grafana/grafana:10.2.3
          ports:
            - containerPort: 3000
              name: web
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: admin
            - name: GF_INSTALL_PLUGINS
              value: grafana-piechart-panel,grafana-clock-panel,stackdriver
            - name: GF_SERVER_ROOT_URL
              value: http://localhost:3000
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /var/secrets/google/key.json
          volumeMounts:
            - name: storage
              mountPath: /var/lib/grafana
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboards-config
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
            - name: gcp-key
              mountPath: /var/secrets/google
              readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 5
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: grafana-storage
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboards-config
          configMap:
            name: grafana-dashboards-config
        - name: dashboards
          configMap:
            name: grafana-dashboards
        - name: gcp-key
          secret:
            secretName: gcp-service-account
            optional: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana
  namespace: dev
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: dev
  labels:
    app: grafana
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
      name: web
  selector:
    app: grafana
