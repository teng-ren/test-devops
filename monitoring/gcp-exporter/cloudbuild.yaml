steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/gcp-exporter:$SHORT_SHA', '-t', 'gcr.io/$PROJECT_ID/gcp-exporter:latest', '.']
    dir: 'monitoring/gcp-exporter'

  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/gcp-exporter:$SHORT_SHA']
    dir: 'monitoring/gcp-exporter'

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/gcp-exporter:latest']
    dir: 'monitoring/gcp-exporter'

  # Deploy to GKE
  - name: 'gcr.io/cloud-builders/kubectl'
    args:
      - 'set'
      - 'image'
      - 'deployment/gcp-monitoring-exporter'
      - 'exporter=gcr.io/$PROJECT_ID/gcp-exporter:$SHORT_SHA'
      - '-n'
      - 'dev'
    env:
      - 'CLOUDSDK_COMPUTE_REGION=us-central1'
      - 'CLOUDSDK_CONTAINER_CLUSTER=ai-model-tester-2'

images:
  - 'gcr.io/$PROJECT_ID/gcp-exporter:$SHORT_SHA'
  - 'gcr.io/$PROJECT_ID/gcp-exporter:latest'

options:
  logging: CLOUD_LOGGING_ONLY
