apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: dev
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        cluster: 'dev-cluster'
        environment: 'production'

    # Alertmanager configuration
    alerting:
      alertmanagers:
        - static_configs:
            - targets: []

    # Rule files
    rule_files:
      - '/etc/prometheus/rules/*.yml'

    # Scrape configurations
    scrape_configs:
      # Kubernetes API server
      - job_name: 'kubernetes-apiservers'
        kubernetes_sd_configs:
          - role: endpoints
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
            action: keep
            regex: default;kubernetes;https

      # Kubernetes nodes
      - job_name: 'kubernetes-nodes'
        kubernetes_sd_configs:
          - role: node
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics

      # Kubernetes node cadvisor
      - job_name: 'kubernetes-cadvisor'
        kubernetes_sd_configs:
          - role: node
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor

      # Kubernetes service endpoints
      - job_name: 'kubernetes-service-endpoints'
        kubernetes_sd_configs:
          - role: endpoints
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scheme]
            action: replace
            target_label: __scheme__
            regex: (https?)
          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_service_annotation_prometheus_io_port]
            action: replace
            target_label: __address__
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
          - action: labelmap
            regex: __meta_kubernetes_service_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_service_name]
            action: replace
            target_label: kubernetes_name
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: kubernetes_pod_name

      # Kubernetes pods
      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: kubernetes_pod_name

      # Custom metrics exporter for app-specific metrics
      - job_name: 'custom-app-metrics'
        static_configs:
          - targets: ['metrics-exporter:9090']
        relabel_configs:
          - target_label: job
            replacement: 'app-metrics'

  recording_rules.yml: |
    groups:
      - name: request_metrics
        interval: 15s
        rules:
          # RPS calculation
          - record: api_requests_per_second
            expr: sum(rate(http_requests_total[1m])) by (service, method, status)

          # Average request latency
          - record: api_request_latency_avg_ms
            expr: sum(rate(http_request_duration_seconds_sum[1m])) by (service) / sum(rate(http_request_duration_seconds_count[1m])) by (service) * 1000

          # Error rate
          - record: api_error_rate
            expr: sum(rate(http_requests_total{status=~"5.."}[1m])) by (service) / sum(rate(http_requests_total[1m])) by (service)

      - name: resource_metrics
        interval: 30s
        rules:
          # Node CPU usage
          - record: node_cpu_usage_percent
            expr: 100 - (avg by (instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)

          # Pod CPU usage
          - record: pod_cpu_usage_percent
            expr: sum(rate(container_cpu_usage_seconds_total{pod!=""}[5m])) by (pod, namespace) * 100

          # Pod memory usage
          - record: pod_memory_usage_bytes
            expr: sum(container_memory_working_set_bytes{pod!=""}) by (pod, namespace)

          # Pod memory usage percent
          - record: pod_memory_usage_percent
            expr: (pod_memory_usage_bytes / sum(container_spec_memory_limit_bytes{pod!=""}) by (pod, namespace)) * 100

  alerting_rules.yml: |
    groups:
      - name: security_alerts
        interval: 30s
        rules:
          - alert: HighAuthFailureRate
            expr: rate(auth_failures_total[5m]) > 10
            for: 2m
            labels:
              severity: critical
              category: security
            annotations:
              summary: "High authentication failure rate detected"
              description: "Auth failure rate is {{ $value }} failures/sec on {{ $labels.instance }}"

          - alert: UnauthorizedAccessAttempt
            expr: increase(http_requests_total{status="401"}[5m]) > 50
            for: 1m
            labels:
              severity: warning
              category: security
            annotations:
              summary: "Multiple unauthorized access attempts"
              description: "{{ $value }} unauthorized attempts in 5 minutes"

      - name: performance_alerts
        interval: 30s
        rules:
          - alert: HighLatency
            expr: api_request_latency_avg_ms > 1000
            for: 5m
            labels:
              severity: warning
              category: performance
            annotations:
              summary: "High API latency detected"
              description: "Average latency is {{ $value }}ms for {{ $labels.service }}"

          - alert: HighErrorRate
            expr: api_error_rate > 0.05
            for: 5m
            labels:
              severity: critical
              category: reliability
            annotations:
              summary: "High error rate detected"
              description: "Error rate is {{ $value | humanizePercentage }} for {{ $labels.service }}"

      - name: resource_alerts
        interval: 30s
        rules:
          - alert: HighCPUUsage
            expr: pod_cpu_usage_percent > 80
            for: 10m
            labels:
              severity: warning
              category: resources
            annotations:
              summary: "High CPU usage on pod"
              description: "Pod {{ $labels.pod }} in {{ $labels.namespace }} is using {{ $value }}% CPU"

          - alert: HighMemoryUsage
            expr: pod_memory_usage_percent > 85
            for: 5m
            labels:
              severity: warning
              category: resources
            annotations:
              summary: "High memory usage on pod"
              description: "Pod {{ $labels.pod }} in {{ $labels.namespace }} is using {{ $value }}% memory"

          - alert: PodRestarting
            expr: rate(kube_pod_container_status_restarts_total[15m]) > 0
            for: 5m
            labels:
              severity: warning
              category: reliability
            annotations:
              summary: "Pod is restarting frequently"
              description: "Pod {{ $labels.pod }} has restarted {{ $value }} times in the last 15 minutes"
