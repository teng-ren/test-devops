apiVersion: apps/v1
kind: Deployment
metadata:
  name: pubsub-emulator
  labels:
    app: pubsub-emulator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pubsub-emulator
  template:
    metadata:
      labels:
        app: pubsub-emulator
    spec:
      containers:
        - name: pubsub-emulator
          image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
          command: ["gcloud", "beta", "emulators", "pubsub", "start", "--host-port=0.0.0.0:8085"]
          ports:
            - containerPort: 8085
          resources:
            limits:
              memory: "256Mi"
              cpu: "250m"
            requests:
              memory: "128Mi"
              cpu: "100m"
---
apiVersion: v1
kind: Service
metadata:
  name: pubsub-emulator
spec:
  selector:
    app: pubsub-emulator
  ports:
    - protocol: TCP
      port: 8085
      targetPort: 8085
