name: Dev Branch CI

on:
  push:
    branches: ["dev", "main"]
  pull_request:
    branches: ["dev", "main"]

jobs:
  ci-dev:
    runs-on: ubuntu-latest
    # Required for uploading security results to the GitHub Security Tab
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- START SERVICES FOR DAST (Using Kubernetes) ---
      - name: Set up Kind cluster
        uses: helm/kind-action@v1.7.0
        with:
          version: v0.19.0
          cluster_name: dev-cluster

      - name: Create .env file
        run: |
          cat > .env << EOF
          POSTGRES_DB=app_db
          POSTGRES_USER=app_user
          POSTGRES_PASSWORD=app_password
          POSTGRES_HOST=auth-postgres-service
          POSTGRES_PORT=5432
          CHATS_POSTGRES_DB=chats_db
          CHATS_POSTGRES_USER=chats_user
          CHATS_POSTGRES_PASSWORD=chats_password
          CHATS_POSTGRES_HOST=chats-postgres-service
          CHATS_POSTGRES_PORT=5432
          DEFAULT_TESTUSER_USERNAME=testuser
          DEFAULT_TESTUSER_PASSWORD=testpass
          DEFAULT_ADMIN_USERNAME=admin
          DEFAULT_ADMIN_PASSWORD=adminpass
          JWT_SECRET=test-secret-key-for-ci
          AUTH_SERVICE_URL=http://auth-service:8001
          ADMIN_SERVICE_URL=http://auth-service:8001
          VITE_API_URL=http://localhost:8000
          PUBSUB_EMULATOR_HOST=pubsub-emulator:8085
          PUBSUB_PROJECT_ID=local-project
          EOF

      - name: Build and Start Services
        run: |
          docker build -t auth:latest ./services/auth.service/
          docker build -t api-gateway:latest ./services/api-gateway.service/
          docker build -t frontend:latest ./app
          docker build -t metrics-exporter:latest ./monitoring/metrics-exporter/
          kind load docker-image auth:latest api-gateway:latest frontend:latest metrics-exporter:latest --name dev-cluster
          kubectl create namespace dev
          
          # Set environment variables for substitution
          export AUTH_SERVICE_IMAGE=auth:latest
          export API_GATEWAY_IMAGE=api-gateway:latest
          export FRONTEND_IMAGE=frontend:latest
          export METRICS_EXPORTER_IMAGE=metrics-exporter:latest
          export POSTGRES_DB=app_db
          export POSTGRES_USER=app_user
          export POSTGRES_PASSWORD=app_password
          export JWT_SECRET=test-secret-key-for-ci
          export API_GATEWAY_IP=""
          
          # Generate manifests with envsubst, remove hardcoded namespaces, and apply to dev
          kustomize build services/auth.service | envsubst | sed '/^  namespace: default$/d' | kubectl apply -f - -n dev
          kustomize build services/api-gateway.service | envsubst | sed '/^  namespace: default$/d' | kubectl apply -f - -n dev
          kustomize build app | envsubst | sed '/^  namespace: default$/d' | kubectl apply -f - -n dev
          kustomize build monitoring | envsubst | sed '/^  namespace: default$/d' | kubectl apply -f - -n dev
          
          echo "Waiting for pods to be ready..."
          kubectl get pods -n dev
          kubectl wait --for=condition=Ready pod -l app=auth-postgres-db -n dev --timeout=180s || (kubectl describe pod -l app=auth-postgres-db -n dev && kubectl logs -l app=auth-postgres-db -n dev --tail=50)
          kubectl wait --for=condition=Ready pod -l app=auth-service -n dev --timeout=180s || (kubectl describe pod -l app=auth-service -n dev && kubectl logs -l app=auth-service -n dev --tail=50)
          kubectl wait --for=condition=Ready pod -l app=api-gateway -n dev --timeout=180s || (kubectl describe pod -l app=api-gateway -n dev && kubectl logs -l app=api-gateway -n dev --tail=50)
          kubectl wait --for=condition=Ready pod -l app=prometheus -n dev --timeout=180s || echo "⚠️ Prometheus not ready"
          kubectl wait --for=condition=Ready pod -l app=grafana -n dev --timeout=180s || echo "⚠️ Grafana not ready"
          kubectl wait --for=condition=Ready pod -l app=kube-state-metrics -n dev --timeout=180s || echo "⚠️ Kube-state-metrics not ready"
          # node-exporter is a DaemonSet, so we just check if pods exist
          kubectl get daemonset -n dev -l app=node-exporter || echo "⚠️ Node-exporter not deployed"
          kubectl get pods -n dev

      - name: Port Forward for DAST
        run: |
          echo "Setting up port-forward to API Gateway..."
          kubectl port-forward -n dev svc/api-gateway 8000:8000 > /tmp/portforward.log 2>&1 &
          PF_PID=$!
          echo "PORT_FORWARD_PID=$PF_PID" >> $GITHUB_ENV
          sleep 5
          
          echo "Testing connection to API Gateway..."
          for i in {1..30}; do
            if curl -s http://localhost:8000 > /dev/null 2>&1; then
              echo "✓ API Gateway is reachable on port 8000"
              curl -v http://localhost:8000 2>&1 | head -20
              break
            fi
            echo "Waiting for API Gateway... ($i/30)"
            sleep 2
          done
          
          # Show port-forward logs if connection failed
          if ! curl -s http://localhost:8000 > /dev/null 2>&1; then
            echo "❌ API Gateway not reachable after 60s"
            echo "Port-forward logs:"
            cat /tmp/portforward.log
            kubectl get pods -n dev
            kubectl logs -n dev -l app=api-gateway --tail=50
            exit 1
          fi

      # --- INTEGRATION TESTING PHASE ---
      - name: Integration Tests (Placeholder)
        id: integration_tests
        run: echo "Integration tests will run here"

      # --- SECURITY PHASE (DAST) ---
      - name: Run DAST (OWASP ZAP)
        id: dast
        uses: zaproxy/action-full-scan@v0.12.0
        with:
          target: 'http://localhost:8000'
          cmd_options: '-a'
        continue-on-error: true

      - name: Upload ZAP Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-scan-reports
          path: |
            report_html.html
            report_md.md
            report_json.json

      - name: Shutdown Services
        if: always()
        run: |
          if [ ! -z "$PORT_FORWARD_PID" ]; then kill $PORT_FORWARD_PID 2>/dev/null || true; fi
          kind delete cluster --name dev-cluster

      # --- PERFORMANCE PHASE ---
      - name: Performance Tests (Placeholder)
        id: perf_tests
        run: echo "Performance tests will run here"

      # --- STAGING DEPLOYMENT ---
      - name: Deploy to Staging
        id: staging_deploy
        if: github.ref == 'refs/heads/dev'
        run: |
          echo "Executing Terraform apply to staging..."
          echo "Updating Kubernetes manifests for staging..."

      # --- NOTIFICATIONS ---

      # Initial Status Alert
      - name: Notify Discord - CI Started
        if: always()
        uses: Ilshidur/action-discord@master
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL_D }}
        with:
          args: "🚀 **CI STARTED** | Branch: `${{ github.ref_name }}` | Actor: `${{ github.actor }}`"

      # ROUTE: INTEGRATION TESTS (Dev Channel)
      - name: Notify Discord - Integration Test Failure
        if: failure() && steps.integration_tests.outcome == 'failure'
        uses: Ilshidur/action-discord@master
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL_I }}
        with:
          args: "🔗 **INTEGRATION FAILURE**: Pub/Sub queue or service communication error. Check: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      # ROUTE: DAST ALERTS (QA Channel)
      - name: Notify Discord - DAST Alert
        if: failure() && steps.dast.outcome == 'failure'
        uses: Ilshidur/action-discord@master
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL_QA }}
        with:
          args: "🔍 **DAST ALERT**: Runtime security vulnerabilities detected during dynamic scanning. Check Security Tab."

      # ROUTE: PERFORMANCE (Lead Dev/Architect)
      - name: Notify Discord - Performance Failure
        if: failure() && steps.perf_tests.outcome == 'failure'
        uses: Ilshidur/action-discord@master
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL_D }}
        with:
          args: "📉 **PERF REGRESSION**: Model latency or RPS thresholds exceeded on `${{ github.ref_name }}`."

      # ROUTE: STAGING DEPLOYMENT (DevOps Team)
      - name: Notify Discord - Staging Deployment Failure
        if: failure() && steps.staging_deploy.outcome == 'failure'
        uses: Ilshidur/action-discord@master
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL_D }}
        with:
          args: "⚠️ **STAGING DEPLOYMENT FAILED**: Unable to deploy to staging environment. Check logs."

      # ROUTE: RELEVANT STAKEHOLDERS (Management/AIDC Leads)
      - name: Notify Stakeholders - Success
        if: success()
        uses: Ilshidur/action-discord@master
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL_MGMT }}
        with:
          args: "✅ **DEV PIPELINE SUCCESS**: All integration, DAST, and performance tests passed. Staging deployment complete."