name: Dev Branch CI

on:
  push:
    branches: ["dev", "main"]
  pull_request:
    branches: ["dev", "main"]

jobs:
  ci-dev:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      issues: write  # ZAP needs this to log findings in your GitHub Issues tab

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- 1. START YOUR MICROSERVICES ---
      - name: Create .env file
        run: |
          cat > .env << EOF
          POSTGRES_DB=devops_db
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=postgres123
          POSTGRES_HOST=db
          POSTGRES_PORT=5432
          JWT_SECRET=test-secret-key-for-ci
          AUTH_SERVICE_URL=http://auth:8001
          ADMIN_SERVICE_URL=http://admin:8002
          VITE_API_URL=http://localhost:8000
          EOF

      - name: Build and Start Services
        run: docker-compose up -d --build

      - name: Wait for API Gateway
        run: |
          echo "Waiting for API Gateway on port 8000..."
          # This loop pings your gateway until it gets a successful response
          timeout 60s bash -c 'until curl -s http://localhost:8000; do sleep 2; echo "Still waiting..."; done'

      # --- 2. SECURITY PHASE (DAST) ---
      - name: Run DAST (OWASP ZAP)
        id: dast
        uses: zaproxy/action-full-scan@v0.12.0  # UPDATED: Latest version fixes Docker error
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target: 'http://localhost:8000'       # Pointing to your API Gateway
          network_name: host                    # CRITICAL: Allows ZAP to reach local Docker ports
          cmd_options: '-t 5 -r zap-report.html'

      # --- 3. CLEANUP ---
      - name: Shutdown Services
        if: always()
        run: docker-compose down
