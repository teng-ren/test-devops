name: Production Release Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Notify Production Pipeline Start
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: https://discord.com/api/webhooks/1460913645713359015/uHIWeLmLWV3Ct8qr6kgBRkX5DWxLUrtZTfEKwVl9Es1pefwlZ1yS5CcsEx6upATmiIyf
          status: ${{ job.status }}
          title: "🚀 Production Release Pipeline Started"
          description: |
            <@&1460616737648148594>
            **Branch:** ${{ github.ref_name }}
            **Commit:** ${{ github.sha }}
            **Message:** ${{ github.event.head_commit.message || github.event.pull_request.title || 'N/A' }}
            **Repository:** ${{ github.repository }}
            **Event:** ${{ github.event_name }}
            **Run ID:** ${{ github.run_id }}
          color: 0xff9900
          username: GitHub Actions

      # --- PRODUCTION DEPLOYMENT ---
      - name: Deploy to Production
        id: deploy
        run: |
          echo "Executing Terraform apply..."
          echo "Updating Kubernetes manifests..."

      - name: Notify Production Deployment Result
        if: always()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: https://discord.com/api/webhooks/1460913645713359015/uHIWeLmLWV3Ct8qr6kgBRkX5DWxLUrtZTfEKwVl9Es1pefwlZ1yS5CcsEx6upATmiIyf
          status: ${{ job.status }}
          title: "✅ Production Deployment Complete"
          description: |
            <@&1460616737648148594>
            **Deploy Status:** ${{ steps.deploy.outcome }}
            **Branch:** ${{ github.ref_name }}
            **Commit:** ${{ github.sha }}
            **Message:** ${{ github.event.head_commit.message || github.event.pull_request.title || 'N/A' }}
            **Repository:** ${{ github.repository }}
            **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          username: GitHub Actions

      - name: Notify Management
        if: always()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: https://discord.com/api/webhooks/1462005434734088296/Q08EUcBqhdOy1-TSQY6KDq1u1cyRh617vffCYni6TXvG-IvxL96ltBZ0XcQzvKeUaWEN
          status: ${{ job.status }}
          title: "📊 Production Release Status"
          description: |
            **Pipeline Status:** ${{ job.status }}
            **Deployment Status:** ${{ steps.deploy.outcome }}
            **Branch:** ${{ github.ref_name }}
            **Commit:** ${{ github.sha }}
            **Message:** ${{ github.event.head_commit.message || github.event.pull_request.title || 'N/A' }}
            **Repository:** ${{ github.repository }}
            **Event:** ${{ github.event_name }}
            **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          username: GitHub Actions
