name: Personal Branch CI

on:
  push:
    branches-ignore: []
  pull_request:
    branches-ignore: []

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Notify CI Start
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL_P }}
          status: ${{ job.status }}
          title: "👨‍💻 Developer CI Started"
          description: |
            **Branch:** ${{ github.ref_name }}
            **Commit:** ${{ github.sha }}
            **Message:** ${{ github.event.head_commit.message || github.event.pull_request.title || 'N/A' }}
            **Repository:** ${{ github.repository }}
            **Run ID:** ${{ github.run_id }}
          color: 0x0099ff
          username: GitHub Actions

      - name: Set up Go (for Backend/Auth)
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Run Linter
        id: linter
        run: |
          cd services/api-gateway.service && go vet ./... && cd ../..
          cd services/auth.service && go vet ./... && cd ../..

      # --- UNIT TESTS ---
      - name: Run Unit Tests for Auth Service
        working-directory: ./services/auth.service
        run: |
          go test -v -short .

      - name: Run Unit Tests for API Gateway Service
        working-directory: ./services/api-gateway.service
        run: |
          go test -v -short .

      - name: Run Unit Tests for Prompt Manager Service
        id: unit_tests
        working-directory: ./services/prompt-manager.service
        run: |
          go test -v -short .

      - name: Notify Unit Tests Result
        if: always()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL_U }}
          status: ${{ steps.unit_tests.outcome }}
          title: "🧪 Unit Tests"
          description: |
            **Test Status:** ${{ steps.unit_tests.outcome }}
            **Branch:** ${{ github.ref_name }}
            **Commit:** ${{ github.sha }}
            **Message:** ${{ github.event.head_commit.message || github.event.pull_request.title || 'N/A' }}
            **Repository:** ${{ github.repository }}
            **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          username: GitHub Actions
    
      # --- SECURITY PHASE (SAST) ---
      - name: Run Go SAST (GoSec)
        id: sast_scan
        uses: securego/gosec@v2.20.0
        with:
          # SAST analyzes source code only - SSA errors are non-critical
          args: '-fmt sarif -out gosec-results.sarif -exclude-generated ./...'
        continue-on-error: true

      - name: Upload GoSec to Security Tab
        # Updated to v4 to fix deprecation
        uses: github/codeql-action/upload-sarif@v4
        # Guard: Only upload if the file actually exists
        if: always() && hashFiles('gosec-results.sarif') != ''
        with:
          sarif_file: gosec-results.sarif
          category: gosec

      # --- SECURITY PHASE (SCA) ---
      - name: Run SCA (Trivy)
        id: sca_scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'

      - name: Upload Trivy to Security Tab
        # Updated to v4 to fix deprecation
        uses: github/codeql-action/upload-sarif@v4
        # Guard: Only upload if the file actually exists
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: trivy-results.sarif
          category: trivy

      - name: Notify Security Scans Result
        if: always()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL_P }}
          status: ${{ job.status }}
          title: "🔒 Security Scans (SAST & SCA)"
          description: |
            **SAST (GoSec):** ${{ steps.sast_scan.outcome }}
            **SCA (Trivy):** ${{ steps.sca_scan.outcome }}
            **Branch:** ${{ github.ref_name }}
            **Commit:** ${{ github.sha }}
            **Message:** ${{ github.event.head_commit.message || github.event.pull_request.title || 'N/A' }}
            **Repository:** ${{ github.repository }}
            **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          username: GitHub Actions

      - name: Notify Quality Gate Complete
        if: always()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL_P }}
          status: ${{ job.status }}
          title: "✅ Quality Gate Complete"
          description: |
            **Final Status:** ${{ job.status }}
            **Linter:** ${{ steps.linter.outcome }}
            **Unit Tests:** ${{ steps.unit_tests.outcome }}
            **SAST:** ${{ steps.sast_scan.outcome }}
            **SCA:** ${{ steps.sca_scan.outcome }}
            **Branch:** ${{ github.ref_name }}
            **Commit:** ${{ github.sha }}
            **Message:** ${{ github.event.head_commit.message || github.event.pull_request.title || 'N/A' }}
            **Repository:** ${{ github.repository }}
            **Event:** ${{ github.event_name }}
            **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          username: GitHub Actions
